apis:
  - aid: netflix-zuul:netflix-zuul-gateway
    name: Netflix Zuul Gateway
    description: >-
      Netflix Zuul is an L7 application gateway built on Netty that provides
      dynamic routing, load balancing, authentication, monitoring, and resiliency
      for edge services. Zuul 3.x is the current release, supporting inbound,
      endpoint, and outbound filter pipelines for intercepting and modifying
      HTTP requests and responses at the edge.
    humanURL: https://github.com/Netflix/zuul
    tags:
      - API Gateway
      - Edge Service
      - Netty
      - Routing
    properties:
      - type: Documentation
        url: https://github.com/Netflix/zuul/wiki
      - type: GettingStarted
        url: https://github.com/Netflix/zuul/wiki/Getting-Started-3.0
      - type: Reference
        url: https://github.com/Netflix/zuul/wiki/How-it-Works-3.0
