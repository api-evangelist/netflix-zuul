        url: https://github.com/Netflix/zuul
      - type: ChangeLog
        url: https://github.com/Netflix/zuul/releases
      - type: Issue Tracker
        url: https://github.com/Netflix/zuul/issues
  - aid: netflix-zuul:netflix-zuul-filters-api
    name: Netflix Zuul Filters API
    description: >-
      The Zuul Filters API provides the core extension point for building
      custom logic into the Zuul gateway pipeline. Developers implement
      inbound, endpoint, and outbound filters using synchronous or asynchronous
      base classes to handle authentication, routing, rate limiting, metrics,
      and response decoration.
    humanURL: https://github.com/Netflix/zuul/wiki/Filters
    tags:
      - Extension
      - Filters
      - Middleware
      - Routing
    properties:
      - type: Documentation
        url: https://github.com/Netflix/zuul/wiki/Filters
      - type: Reference
        url: https://github.com/Netflix/zuul/wiki/Writing-Filters
      - type: GitHubRepository
        url: https://github.com/Netflix/zuul
  - aid: netflix-zuul:netflix-zuul-push-messaging
    name: Netflix Zuul Push Messaging
    description: >-
      Zuul Push Messaging enables server-to-client push communications over
      WebSockets and Server Sent Events (SSE). It provides a
      PushConnectionRegistry for managing connected clients and supports
      distributed deployments using external datastores such as Redis,
      Cassandra, or DynamoDB for multi-node clusters.
    humanURL: https://github.com/Netflix/zuul/wiki/Push-Messaging
    tags:
      - Push Messaging
      - Real-Time
      - Server-Sent Events
      - WebSocket
    tags_raw:
