aid: netflix-zuul
name: Netflix Zuul
description: >-
  Netflix Zuul is an open-source L7 application gateway that provides dynamic
  routing, monitoring, resiliency, and security for edge services. Originally
  developed by Netflix, Zuul 2 uses Netty for non-blocking I/O and is commonly
  used as an API gateway and edge service.
